[package]
name = "eso_companion"
version = "0.1.0"
description = "ESO Companion personal desktop overlay"
authors = ["Logiinx"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
tauri-plugin-global-shortcut = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
